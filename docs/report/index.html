<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ISOPrint Inspector 打印输出印刷质量评估报告</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="ScanLine"></i></span>
      <div>
        <div class="brand-title">ISOPrint Inspector</div>
        <div class="brand-sub">打印输出印刷质量评估报告</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-clear" class="btn ghost" type="button" title="清空已选文件">
        <i data-lucide="Trash2"></i><span>清空</span>
      </button>
    </div>
  </header>

  <main class="shell">
    <section class="upload-grid">
      <div id="dropzone" class="dropzone" tabindex="0">
        <i data-lucide="UploadCloud"></i>
        <h1>选择测量文件</h1>
        <p>JSON / XLSX / TXT / CSV / DAT · 文件在浏览器内分析</p>
        <button id="btn-pick" class="btn primary" type="button">选择文件</button>
        <input id="file-input" type="file" multiple hidden accept=".json,.xlsx,.txt,.csv,.dat"/>
      </div>
      <div class="file-panel">
        <div class="panel-head">
          <h2>已选文件</h2>
          <span id="file-count" class="pill">0 个</span>
        </div>
        <div id="file-list" class="file-list">
          <div class="empty-state">
            <i data-lucide="Files"></i>
            <span>等待选择测量文件</span>
          </div>
        </div>
        <button id="btn-analyze" class="btn primary block" type="button" disabled>
          <i data-lucide="Play"></i><span>统一分析</span>
        </button>
      </div>
    </section>

    <section id="result" class="result hidden">
      <div class="result-head">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-tab="overview" role="tab">
            <i data-lucide="Gauge"></i><span>质量概览</span>
          </button>
          <button class="tab" type="button" data-tab="metrics" role="tab">
            <i data-lucide="Table2"></i><span>指标明细</span>
          </button>
          <button class="tab" type="button" data-tab="report" role="tab">
            <i data-lucide="Eye"></i><span>报告预览</span>
          </button>
          <button class="tab" type="button" data-tab="integrity" role="tab">
            <i data-lucide="ShieldCheck"></i><span>数据完整性</span>
          </button>
        </div>
        <div class="result-actions">
          <button id="btn-download-json" class="btn ghost sm" type="button" title="下载统一分析结果 JSON">
            <i data-lucide="Download"></i><span>JSON</span>
          </button>
          <button id="btn-download-report" class="btn ghost sm" type="button" title="下载完整 HTML 报告">
            <i data-lucide="Download"></i><span>HTML 报告</span>
          </button>
          <button id="btn-download-pdf" class="btn ghost sm" type="button" title="将报告页面保存为 PDF">
            <i data-lucide="FileText"></i><span>打印 / PDF</span>
          </button>
        </div>
      </div>

      <div id="sample-bar" class="sample-bar hidden"></div>

      <div id="overview" class="tab-panel active">
        <div class="overview-grid">
          <div id="overall-card" class="overall-card"></div>
          <div id="batch-card" class="batch-card"></div>
        </div>
        <div class="overview-grid">
          <div class="panel">
            <div class="panel-head"><h3>维度评分</h3></div>
            <div id="dimension-grid" class="dimension-grid"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>主要发现</h3></div>
            <div id="findings" class="findings"></div>
          </div>
        </div>
        <div class="overview-grid">
          <div class="panel">
            <div class="panel-head"><h3>OECF 曲线</h3></div>
            <div id="oecf-chart" class="chart-box"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>MTF 曲线</h3></div>
            <div id="mtf-chart" class="chart-box"></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>综合质量雷达</h3></div>
          <div id="radar-chart" class="chart-box"></div>
        </div>
      </div>

      <div id="metrics" class="tab-panel">
        <div class="filter-bar">
          <label class="search-box">
            <i data-lucide="Search"></i>
            <input id="metric-search" type="search" placeholder="搜索指标"/>
          </label>
          <select id="metric-module-filter" class="select">
            <option value="">全部模块</option>
          </select>
          <select id="metric-sample-filter" class="select">
            <option value="">全部样品</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>样品编号</th>
                <th>模块</th>
                <th>指标</th>
                <th>测试结果</th>
                <th>单位</th>
                <th>状态</th>
                <th>来源文件</th>
              </tr>
            </thead>
            <tbody id="metric-table-body"></tbody>
          </table>
        </div>
      </div>

      <div id="report" class="tab-panel">
        <div class="report-frame-wrap">
          <iframe id="report-frame" title="ISOPrint Inspector 报告预览"></iframe>
        </div>
      </div>

      <div id="integrity" class="tab-panel">
        <div class="overview-grid">
          <div class="panel">
            <div class="panel-head"><h3>文件解析状态</h3></div>
            <div id="integrity-files" class="integrity-files"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>有效性与说明</h3></div>
            <div id="integrity-notes" class="integrity-notes"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" role="status" class="toast hidden"></div>
  <script src="./vendor/lucide.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
